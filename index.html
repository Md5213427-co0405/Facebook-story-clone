<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Story Clone</title>
    <link rel="stylesheet" href="style.css">

    <!-- google fonts icon link bethout icon-name -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
    <!-- navbar -->
    <div class="navbar">
        <div class="nav-left">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-LErAqHolbq_knY2ypohv4LBlspgH9kmoxMtuG4fcpw&s=10" alt="logo" class="logo">

        </div>

        <div class="nav-center">
            <span class="material-symbols-outlined nav-icon">home</span>
            <span class="material-symbols-outlined nav-icon">live_tv</span>
            <span class="material-symbols-outlined nav-icon">storefront</span>
            <span class="material-symbols-outlined nav-icon">groups</span>
            <span class="material-symbols-outlined nav-icon">explore</span>
        </div>

        <div class="nav-right">
            <span class="material-symbols-outlined circle-icon">add</span>
            <span class="material-symbols-outlined circle-icon">notifications</span>
            <span class="material-symbols-outlined circle-icon">chat</span>

        </div>

    </div>

     <div class="story-section">

                <p class="story-user">Your Story</p>

            <div class="story">
